<!DOCTYPE html>
<html lang="en">

<head>
    <title>NANDbox — Boolean Logic Simulator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A powerful web-based boolean logic simulation tool. Build and test digital circuits with gates, flip-flops, clocks, and more.">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="css/index.css" rel="stylesheet">
    <style>
        .landing-body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* Animated grid background */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.6;
            animation: gridFloat 20s ease-in-out infinite;
        }

        @keyframes gridFloat {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-5px, -5px);
            }
        }

        .hero {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
        }

        .hero-title .accent {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            color: var(--text-secondary);
            font-size: clamp(14px, 2vw, 18px);
            margin: 12px 0 4px;
            font-weight: 400;
        }

        .hero-author {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 8px;
        }

        .hero-author a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .hero-author a:hover {
            color: var(--accent);
        }

        .hero-tech {
            color: var(--text-muted);
            font-size: 12px;
            margin: 0 0 36px;
            letter-spacing: 0.5px;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            color: white;
            background: var(--accent);
            border: 2px solid #fff;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .cta-button:hover {
            background: #fff;
            color: var(--accent);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .landing-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }
    </style>
</head>

<body class="landing-body">
    <div class="grid-bg"></div>

    <div class="hero">
        <h1 class="hero-title">NAND<span class="accent">box</span></h1>
        <p class="hero-subtitle">A powerful web-based boolean logic simulation tool</p>
        <p class="hero-author">Developed by <a href="https://github.com/jleesCY" target="_blank">Joshua Lees</a></p>
        <p class="hero-tech">Built with JavaScript, HTML, CSS • Bootstrap 5 • jQuery</p>
        <a href="simulate" class="cta-button">Start Simulating →</a>
    </div>

    <div class="landing-footer">
        <span>© 2026 Joshua Lees. All rights reserved.</span>
        <span>v0.3.0</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
</body>

</html>
